appId: ai.gamecrafter.controlroom
productName: PlayWeld
# Keep the executable identity stable for existing installations and service launchers.
executableName: GameCrafter
icon: ../../assets/brand/app-icon-512.png
artifactName: ${productName}-${version}-${arch}.${ext}
asar: false
# Theia rebuilds for the host; electron-builder must rebuild native addons for the target OS.
npmRebuild: true
electronFuses:
  runAsNode: true
files:
  - lib/**/*
  - src-gen/**/*
  - package.json
  - node_modules/**/*
  - '!node_modules/**/*.map'
  - '!node_modules/**/test{,/**/*}'
  - '!node_modules/**/tests{,/**/*}'
  - '!node_modules/**/__tests__{,/**/*}'
  - '!node_modules/**/examples{,/**/*}'
  - '!node_modules/**/src{,/**/*}'
extraResources:
  - from: resources/qdrant
    to: qdrant
    filter:
      - '**/*'
  - from: ../../LICENSE
    to: LICENSE.GameCrafter.txt
  - from: ../../NOTICE
    to: NOTICE.GameCrafter.txt
  - from: ../../plugins
    to: plugins
    filter:
      - '**/*'
directories:
  output: dist/${version}
linux:
  category: Development
  maintainer: PlayWeld
  executableName: gamecrafter
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
win:
  icon: ../../assets/brand/app-icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish: null
