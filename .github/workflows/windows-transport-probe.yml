name: Windows credential transport probe
on:
  workflow_dispatch:
jobs:
  transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/probe-windows-dpapi-transport.cjs
      - run: npm ci --foreground-scripts
      - run: npx turbo run build --filter=@gamecrafter/platform-service
      - name: Isolated application protected-key regression
        working-directory: packages/platform-service
        run: npx vitest run src/updates/release-metadata-cli.test.ts --maxWorkers=1 --testTimeout=30000 --hookTimeout=60000
