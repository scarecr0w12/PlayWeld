name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: node scripts/check-release-version.cjs ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - run: node scripts/change-tracking.cjs check --release

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Windows'
        uses: ./.github/actions/ensure-windows-spectre
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - if: runner.os == 'Linux'
        run: npm ci
      - if: runner.os == 'Windows'
        run: npm ci --foreground-scripts
      - run: npx turbo run build typecheck lint test --filter=@gamecrafter/control-room^... --concurrency=1
      - run: node scripts/generate-system-reference.cjs --check
      - run: npm run download:plugins
      - run: npm run package:${{ matrix.target }} -w @gamecrafter/control-room
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-linux
          path: |
            apps/control-room/dist/${{ needs.validate.outputs.version }}/*.AppImage
            apps/control-room/dist/${{ needs.validate.outputs.version }}/*.deb
          if-no-files-found: error
          retention-days: 7
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-win
          path: apps/control-room/dist/${{ needs.validate.outputs.version }}/PlayWeld-*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - run: npm ci
      - run: npx turbo run build --filter=@gamecrafter/platform-service
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create release metadata (unsigned testing prerelease if no key is configured)
        run: node scripts/create-release-metadata.cjs release-artifacts --allow-unsigned-prerelease
        env:
          RELEASE_PRERELEASE: 'true'
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: true
          body_path: docs/releases/v${{ needs.validate.outputs.version }}.md
          files: release-artifacts/*
