name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        run: node scripts/check-release-version.cjs ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - run: node scripts/change-tracking.cjs check --release
      - name: Validate concise publication notes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./apps/control-room/package.json');
          const body = fs.readFileSync(`docs/releases/v${version}-summary.md`, 'utf8');
          if (!body.trim() || Array.from(body).length > 125000)
            throw new Error('GitHub release notes must contain 1–125000 characters.');
          NODE

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Windows'
        uses: ./.github/actions/ensure-windows-spectre
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - if: runner.os == 'Linux'
        run: npm ci
      - if: runner.os == 'Windows'
        run: npm ci --foreground-scripts
      - run: npx turbo run build typecheck lint test --filter=@gamecrafter/control-room^... --concurrency=1
      - run: node scripts/generate-system-reference.cjs --check
      - run: npm run download:plugins
      - run: npm run package:${{ matrix.target }} -w @gamecrafter/control-room
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux
          path: |
            apps/control-room/dist/${{ needs.validate.outputs.version }}/*.AppImage
            apps/control-room/dist/${{ needs.validate.outputs.version }}/*.deb
          if-no-files-found: error
          retention-days: 7
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-win
          path: apps/control-room/dist/${{ needs.validate.outputs.version }}/PlayWeld-*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - run: npm ci
      - run: npx turbo run build --filter=@gamecrafter/platform-service
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create release metadata (unsigned testing prerelease if no key is configured)
        run: node scripts/create-release-metadata.cjs release-artifacts --allow-unsigned-prerelease
        env:
          RELEASE_PRERELEASE: 'true'
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
      - name: Preserve complete version notes as a release asset
        run: cp docs/releases/v${{ needs.validate.outputs.version }}.md release-artifacts/PlayWeld-${{ needs.validate.outputs.version }}-release-notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: true
          body_path: docs/releases/v${{ needs.validate.outputs.version }}-summary.md
          files: release-artifacts/*
