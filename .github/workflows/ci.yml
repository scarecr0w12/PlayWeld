name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# PRs cover feature branches; pushes cover integration on main without duplicate branch runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check work records for the complete change
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -z "$CHANGE_BASE" ] || [[ "$CHANGE_BASE" =~ ^0+$ ]]; then
            CHANGE_BASE=$(git merge-base HEAD 4e13420)
          fi
          node scripts/change-tracking.cjs check --base "$CHANGE_BASE" --committed
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libx11-dev libxkbfile-dev libsecret-1-dev
      - if: runner.os == 'Windows'
        uses: ./.github/actions/ensure-windows-spectre
      - if: runner.os == 'Linux'
        run: npm ci
      - if: runner.os == 'Windows'
        run: npm ci --foreground-scripts
      - run: npx turbo run build typecheck lint test --concurrency=1
      - run: npm run test:changes
      - run: npm run test:cache-maintenance
      - run: node scripts/check-release-version.cjs
      - run: node scripts/generate-system-reference.cjs --check
      - run: node scripts/generate-documentation-inventory.cjs --check
      - run: node scripts/check-documentation-evidence.cjs
      - run: npm run format:check
      - if: runner.os == 'Linux'
        run: bash scripts/check-links.sh

  theia-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - run: npm ci
      - run: npx turbo run build --filter=@gamecrafter/control-room-browser^...
      - run: npm run download:plugins
      - run: npm run build -w @gamecrafter/control-room-browser
      # Electron rebuild is left to the desktop release workflow.
      - name: Live browser UI smoke
        shell: bash
        env:
          GAMECRAFTER_PROFILE_DIR: ${{ runner.temp }}/gamecrafter-ui-profile
          THEIA_CONFIG_DIR: ${{ runner.temp }}/gamecrafter-ui-config
        run: |
          npm run start -w @gamecrafter/control-room-browser > "$RUNNER_TEMP/gamecrafter-ui.log" 2>&1 &
          gamecrafter_ui_pid=$!
          trap 'kill "$gamecrafter_ui_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          # This disposable hosted runner blocks Chromium user namespaces.
          npm run test:ui -- --no-sandbox
      - name: Requests keyboard and recovery acceptance
        env:
          GAMECRAFTER_REQUESTS_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/requests-keyboard
        run: npm run test:ui:requests-keyboard -- --no-sandbox
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-ui-evidence
          path: |
            .artifacts/live-browser/
            ${{ runner.temp }}/requests-keyboard/**/report.json
            ${{ runner.temp }}/requests-keyboard/**/failure.json
            ${{ runner.temp }}/requests-keyboard/**/*.png
          if-no-files-found: warn
